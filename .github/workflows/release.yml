name: macOS package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - name: Use neutral build paths
        shell: bash
        run: |
          echo "CARGO_TARGET_DIR=$(mktemp -d /private/tmp/webos-dev-manager-build.XXXXXX)" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=--remap-path-prefix=$HOME=/build/user" >> "$GITHUB_ENV"
      - name: Build app and DMG
        run: npm run build -- --ci -- --locked
        env:
          CI: true
      - name: Prepare DMG and checksum
        id: artifacts
        run: node scripts/list-release-artifacts.js
      - uses: actions/upload-artifact@v4
        with:
          name: webos-dev-manager-macos-arm64
          path: ${{ steps.artifacts.outputs.paths }}
          if-no-files-found: error
