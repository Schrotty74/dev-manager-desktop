@if (checkingDevice) {
  <div class="p-3"><app-loading-card/></div>
} @else {
  <div class="w-100 h-100 d-flex flex-column">
    <ul ngbNav class="nav-tabs pt-2 px-2 bg-panel" #nav="ngbNav" (navChange)="tabChange($event)"
        [activeId]="activeTab" [destroyOnHide]="true">
      <li ngbNavItem="crashes">
        <a ngbNavLink>Crash Reports</a>
        <ng-template ngbNavContent>
          @if (receiver) {
            <app-receiver-logs [device]="device" kind="crash"/>
          } @else {
            <app-crashes [device]="device"/>
          }
        </ng-template>
      </li>
      @if (receiver) {
        <li ngbNavItem="enigma">
          <a ngbNavLink>Enigma2 Logs</a>
          <ng-template ngbNavContent><app-receiver-logs [device]="device" kind="enigma"/></ng-template>
        </li>
        <li ngbNavItem="dmesg">
          <a ngbNavLink>Kernel Log</a>
          <ng-template ngbNavContent><app-receiver-logs [device]="device" kind="kernel"/></ng-template>
        </li>
        <li ngbNavItem="oscam">
          <a ngbNavLink>OSCam Live Log</a>
          <ng-template ngbNavContent><app-receiver-logs [device]="device" kind="oscam"/></ng-template>
        </li>
      } @else if (device && device.username !== 'prisoner') {
        <li ngbNavItem="pmlog">
          <a ngbNavLink>Syslog</a>
          <ng-template ngbNavContent><app-pmlog [device]="device"/></ng-template>
        </li>
        <li ngbNavItem="dmesg">
          <a ngbNavLink>dmesg</a>
          <ng-template ngbNavContent><app-dmesg [device]="device"/></ng-template>
        </li>
        <li ngbNavItem="ls-monitor">
          <a ngbNavLink>ls-monitor</a>
          <ng-template ngbNavContent><app-ls-monitor [device]="device"/></ng-template>
        </li>
      }
    </ul>
    <div class="flex-fill overflow-hidden debug-content" [ngbNavOutlet]="nav"></div>
  </div>
}
